services:
  db:
    image: postgis/postgis:16-3.4
    container_name: georiesgo-postgis
    environment:
      POSTGRES_DB: georiesgo
      POSTGRES_USER: georiesgo
      POSTGRES_PASSWORD: georiesgo
    # 5433 en vez de 5432 para no chocar con un PostgreSQL local instalado aparte
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U georiesgo -d georiesgo"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
