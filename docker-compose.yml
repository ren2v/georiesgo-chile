services:
  db:
    build: docker/db
    image: georiesgo-db:16-3.4-pgvector
    container_name: georiesgo-postgis
    environment:
      POSTGRES_DB: georiesgo
      POSTGRES_USER: georiesgo
      POSTGRES_PASSWORD: georiesgo
    # 5434 en vez de 5432 para no chocar con otros Postgres locales (5432/5433
    # suelen estar tomados por otros proyectos o una instalación nativa)
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U georiesgo -d georiesgo"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
